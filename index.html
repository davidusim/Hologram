<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hologram Display - Pepper's Ghost Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            touch-action: none;
        }

        #hologram-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #00ffff;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 1000;
            max-width: 300px;
        }

        .controls {
            margin-top: 10px;
        }

        .controls button {
            background: #00ffff;
            color: #000000;
            border: none;
            padding: 5px 10px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .controls button:hover {
            background: #00cccc;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-active { background-color: #00ff00; }
        .status-inactive { background-color: #ff0000; }
    </style>
</head>
<body>
    <div id="info-panel">
        <div>Hologram Display System</div>
        <div>Status: <span class="status-indicator" id="status-indicator"></span><span id="status-text">Initializing...</span></div>
        <div>FPS: <span id="fps-counter">0</span></div>
        <div class="controls">
            <button id="toggle-spin">Toggle Spin</button>
            <button id="reset-view">Reset View</button>
            <button id="fullscreen-toggle">Fullscreen</button>
        </div>
    </div>

    <div id="hologram-container"></div>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <!-- Optional: For post-processing effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/examples/js/shaders/CopyShader.js"></script>
    <script src="hologram.js"></script>
</body>
</html>
